<!doctype html>
<html lang="en" class="is-tool" data-card="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff5959">
<script src="../../shared/palette.js"></script>
<title>Tool name — Creative tools</title>
<link rel="stylesheet" href="../../shared/theme.css">
<link rel="stylesheet" href="../../shared/tool.css">
<link rel="icon" type="image/png" sizes="64x64" href="../../shared/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../shared/favicon-32.png">
<link rel="apple-touch-icon" href="../../shared/site-icon-180.png">
</head>
<body class="toolpage">
<header class="toolhead">
  <div class="toolhead__side">
    <a class="title back" href="../../">← Back</a>
    <p class="small instructions">Instructions to use the tool in every detail and more texts related.</p>
  </div>
  <h1 class="title toolhead__title"></h1>
</header>
<div class="toolgrid grid6">
  <aside class="menu" aria-label="Controls">
    <!-- Each control group is a .block (add .full for a full-width one). -->
    <div class="block"><label>Control A</label></div>
    <div class="block"><label>Control B</label></div>
    <div class="block full"><label>Wide control</label></div>
  </aside>
  <section class="stage" aria-label="Artwork">
    <!-- --ar = width / height of the real artwork frame (4:5 = 0.8). Change it from JS for other ratios. -->
    <div class="artwork" id="artwork" style="--ar:0.8"></div>
  </section>
</div>
<script src="../../shared/tool.js"></script>
<script src="../../shared/leave.js"></script>
<script src="../../shared/smooth-scroll.js"></script>
</body>
</html>
